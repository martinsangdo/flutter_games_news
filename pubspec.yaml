name: games_news
description: "Games News - a lightweight video-game news reader for Wccftech, Siliconera and PCGamesN."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Every version is pinned exactly; pubspec.lock pins the transitive graph.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9
  flutter_riverpod: 2.6.1

  # Networking, parsing, HTML rendering
  http: 1.6.0
  html: 0.15.7
  xml: 7.0.1
  flutter_widget_from_html: 0.17.4

  # Images and web fonts (Inter / Montserrat / Passion One, as used by the news sites)
  cached_network_image: 3.4.1
  flutter_cache_manager: 3.4.5
  google_fonts: 8.2.1

  # Storage
  sqflite: 2.4.2+1
  sqflite_common_ffi_web: 1.1.1
  path: 1.9.1
  path_provider: 2.1.6

  # Platform features
  share_plus: 13.3.0
  # 9.1.0 fails to compile on iOS (non-modular GoogleMobileAds_Beta.h import) under Xcode 26.3.
  google_mobile_ads: 9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.0+3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/splash_icon_512x512.png
